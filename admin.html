<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DAMATA — заявки</title><link rel="stylesheet" href="/styles.css"><script defer src="/admin.js"></script><script defer src="/catalog-admin.js"></script></head><body><main class="wrap section admin"><a href="/" class="text-link">← DAMATA</a><h1>Управление<br><em>DAMATA.</em></h1><form id="login" novalidate><div class="field"><label for="token">Ключ администратора</label><input id="token" type="password" autocomplete="off" placeholder="Ключ из data/admin-token.txt"></div><p class="muted">Локальный доступ. Ключ хранится в файле data/admin-token.txt на этом компьютере и используется только в памяти вкладки.</p><button class="pill filled" type="submit">Открыть заявки</button></form><div id="admin-status" role="status" aria-live="polite"></div><div id="admin-toolbar" hidden><div class="admin-tabs" role="group" aria-label="Раздел админки"><button id="tab-leads" class="pill filled" onclick="showSection('leads')">Заявки</button><button id="tab-catalog" class="pill" onclick="showSection('catalog')">Каталог и цены</button></div><button id="refresh" class="pill" onclick="refreshAdmin()">Обновить</button><button id="logout" class="pill" onclick="logout()">Выйти</button><p id="leads-count-note" class="muted">Последние 100 заявок. Все записи сохраняются в базе.</p></div><div id="leads"></div><section id="catalog-editor" hidden></section></main></body></html>
